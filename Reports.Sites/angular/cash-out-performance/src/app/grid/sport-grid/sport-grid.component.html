<ng-template #colgroup>
  <colgroup>
    <col style="width: 250px" />
    <col style="width: 150px" />
    <col style="width: 150px" />
    <col style="width: 150px" />
    <col style="width: 150px" />
    <col style="width: 150px" />
    <col style="width: 150px" />
    <col style="width: 150px" />
    <col style="width: 130px" />
    <col style="width: 130px" />
    <col style="width: 140px" />
    <col style="width: 120px" />
  </colgroup>
</ng-template>
<ng-template #thead>
  <thead>
    <tr>
      <th scope="col" rowspan="2">Sport</th>
      <th scope="col" colspan="11">BaseRM</th>
    </tr>
    <tr>
      <th scope="col">Cash Out Turnover</th>
      <th scope="col">Actual Turnover</th>
      <th scope="col">Buy Back Amount</th>
      <th scope="col">Member WL</th>
      <th scope="col">Assumed Payout</th>
      <th scope="col">Hyp.GGR NO CO (Full PT)</th>
      <th scope="col">Cash Out Profit (Full PT)</th>
      <th scope="col">Margin</th>
      <th scope="col">Commission</th>
      <th scope="col">Cash Out Income</th>
      <th scope="col">Total Income (House PT)</th>
    </tr>
  </thead>
</ng-template>
<ng-template #rowSportItem let-item="item">
  <tr class="sub-total-row font-weight-bold">
  <td (click)="item.collapsed=!item.collapsed">
    <i [ngClass]="{'fa-caret-down': item.collapsed, 'fa-caret-right': !item.collapsed}"
                                    class="fa"></i>&nbsp;
    <a href="javascript:;" (click)="showEventStatusLevel(item.SportType, item.SportName)">{{item.SportName}}</a></td>
  <td class="text-right" [napDecimalFormat]="item.COTurnover_RM"></td>
  <td *ngIf="isShowNotAvailable(item.ActualTurnover)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.ActualTurnover)" class="text-right" [napDecimalFormat]="item.ActualTurnover"></td>
  <td class="text-right" [napDecimalFormat]="item.BBAmount_RM"></td>
  <td class="text-right red-positive" [napDecimalFormat]="item.MemberWL_RM"></td>
  <td *ngIf="isShowNotAvailable(item.AssumedPayout)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.AssumedPayout)" class="text-right" [napDecimalFormat]="item.AssumedPayout"></td>
  <td *ngIf="isShowNotAvailable(item.HypGGR)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.HypGGR)" class="text-right red-positive" [napDecimalFormat]="item.HypGGR"></td>
  <td *ngIf="isShowNotAvailable(item.COProfit)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.COProfit)" class="text-right red-positive" [napDecimalFormat]="item.COProfit">
  </td>
  <td *ngIf="isShowNotAvailable(item.Margin)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.Margin)" class="text-right number red-positive" [napPercentFormat]="item.Margin"></td>
  <td class="text-right" [napDecimalFormat]="item.Comm_RM"></td>
  <td class="text-right red-positive" [napDecimalFormat]="item.COIncome_RM"></td>
  <td class="text-right red-positive" [napDecimalFormat]="item.TotalIncome_RM"></td>
  </tr>
</ng-template>
<ng-template #rowLeagueItem let-item="item">
  <td>{{item.LeagueName}}</td>
  <td class="text-right" [napDecimalFormat]="item.COTurnover_RM"></td>
  <td *ngIf="isShowNotAvailable(item.ActualTurnover)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.ActualTurnover)" class="text-right" [napDecimalFormat]="item.ActualTurnover"></td>
  <td class="text-right" [napDecimalFormat]="item.BBAmount_RM"></td>
  <td class="text-right red-positive" [napDecimalFormat]="item.MemberWL_RM"></td>
  <td *ngIf="isShowNotAvailable(item.AssumedPayout)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.AssumedPayout)" class="text-right" [napDecimalFormat]="item.AssumedPayout"></td>
  <td *ngIf="isShowNotAvailable(item.HypGGR)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.HypGGR)" class="text-right red-positive" [napDecimalFormat]="item.HypGGR"></td>
  <td *ngIf="isShowNotAvailable(item.COProfit)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.COProfit)" class="text-right red-positive" [napDecimalFormat]="item.COProfit">
  </td>
  <td *ngIf="isShowNotAvailable(item.Margin)" class="text-right">&nbsp;</td>
  <td *ngIf="!isShowNotAvailable(item.Margin)" class="text-right number red-positive" [napPercentFormat]="item.Margin"></td>
  <td class="text-right" [napDecimalFormat]="item.Comm_RM"></td>
  <td class="text-right red-positive" [napDecimalFormat]="item.COIncome_RM"></td>
  <td class="text-right red-positive" [napDecimalFormat]="item.TotalIncome_RM"></td>
</ng-template>
<div *ngIf="dataViewModel" [ngSwitch]="dataViewModel.TotalItems > 0">
  <div class="nap-grid">
    <div style="width: 1840px">
      <div class="header">
        <table>
          <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
          <ng-template [ngTemplateOutlet]="thead"></ng-template>
        </table>
      </div>
      <div *ngSwitchCase="true" class="body">
        <table class="table">
          <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
          <tbody>
            <ng-container *ngFor="let parentItem of dataViewModel.Sports">
              <ng-template [ngTemplateOutlet]="rowSportItem" [ngTemplateOutletContext]="{ item: parentItem.SportTotal }">
              </ng-template>
              <ng-container *ngIf="parentItem.SportTotal.collapsed">
                <tr *ngFor="let childItem of parentItem.ChildItems">
                  <ng-template [ngTemplateOutlet]="rowLeagueItem" [ngTemplateOutletContext]="{ item: childItem }">
                  </ng-template>
                </tr>
              </ng-container>
            </ng-container>
          </tbody>
        </table>
      </div>
      <div *ngSwitchCase="false" class="body stretch">
        <table>
          <tbody>
            <tr>
              <th scope="col" class="no-data" colspan="12">
                There is no data
              </th>
            </tr>
          </tbody>
        </table>
      </div>
      <div *ngSwitchCase="true" class="footer">
        <table>
          <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
          <tfoot>
            <tr class="font-weight-bold">
              <td class="text-right">Grand Total</td>
              <td class="text-right" [napDecimalFormat]="dataViewModel.GrandTotal.COTurnover_RM"></td>
              <td *ngIf="isShowNotAvailable(dataViewModel.GrandTotal.ActualTurnover)" class="text-right">&nbsp;</td>
              <td *ngIf="!isShowNotAvailable(dataViewModel.GrandTotal.ActualTurnover)" class="text-right"
                [napDecimalFormat]="dataViewModel.GrandTotal.ActualTurnover"></td>
              <td class="text-right" [napDecimalFormat]="dataViewModel.GrandTotal.BBAmount_RM"></td>
              <td class="text-right red-positive" [napDecimalFormat]="dataViewModel.GrandTotal.MemberWL_RM"></td>
              <td *ngIf="isShowNotAvailable(dataViewModel.GrandTotal.AssumedPayout)" class="text-right">&nbsp;</td>
              <td *ngIf="!isShowNotAvailable(dataViewModel.GrandTotal.AssumedPayout)" class="text-right"
                [napDecimalFormat]="dataViewModel.GrandTotal.AssumedPayout"></td>
              <td *ngIf="isShowNotAvailable(dataViewModel.GrandTotal.HypGGR)" class="text-right">&nbsp;</td>
              <td *ngIf="!isShowNotAvailable(dataViewModel.GrandTotal.HypGGR)" class="text-right red-positive"
                [napDecimalFormat]="dataViewModel.GrandTotal.HypGGR"></td>
              <td *ngIf="isShowNotAvailable(dataViewModel.GrandTotal.COProfit)" class="text-right">&nbsp;</td>
              <td *ngIf="!isShowNotAvailable(dataViewModel.GrandTotal.COProfit)" class="text-right red-positive"
                [napDecimalFormat]="dataViewModel.GrandTotal.COProfit"></td>
              <td *ngIf="isShowNotAvailable(dataViewModel.GrandTotal.Margin)" class="text-right">&nbsp;</td>
              <td *ngIf="!isShowNotAvailable(dataViewModel.GrandTotal.Margin)" class="text-right number red-positive"
                [napPercentFormat]="dataViewModel.GrandTotal.Margin"></td>
              <td class="text-right" [napDecimalFormat]="dataViewModel.GrandTotal.Comm_RM"></td>
              <td class="text-right red-positive" [napDecimalFormat]="dataViewModel.GrandTotal.COIncome_RM"></td>
              <td class="text-right red-positive" [napDecimalFormat]="dataViewModel.GrandTotal.TotalIncome_RM"></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
</div>
