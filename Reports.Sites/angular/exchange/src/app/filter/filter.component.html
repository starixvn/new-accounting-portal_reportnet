<div class="nap-filter">
  <div class="row">
    <div class="nap-col">
      <div class="nap-group">
        <label>Date</label>
        <div class="nap-control">
          <nap-dropdown-select [items]="timePeriodSelectItems" [(value)]="timePeriod" (valueChange)="onTimePeriodChange()">
          </nap-dropdown-select>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>From Date</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="startDate" [minDate]="minStartDate" [maxDate]="maxEndDate" (dateChange)="onDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label>To Date</label>
        <div class="nap-control">
          <nap-date-picker [(date)]="endDate" [minDate]="startDate" [maxDate]="maxEndDate" (dateChange)="onDateChange()"></nap-date-picker>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label class="col-form-label">Licensee</label>
        <div class="nap-control">
          <ngx-dropdown-treeview [items]="licenseeTreeviewItems" [config]="treeviewConfig" (selectedChange)="onLicenseeSelectedChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col">
      <div class="nap-group">
        <label class="col-form-label">Sport</label>
        <div class="nap-control">
          <ngx-dropdown-treeview [items]="sportTreeviewItems" [config]="treeviewConfig" (selectedChange)="onSportSelectedChange($event)">
          </ngx-dropdown-treeview>
        </div>
      </div>
    </div>
    <div class="nap-col col-buttons">
      <button class="btn btn-primary" (click)="onGenerate()">GENERATE</button>
    </div>
  </div>
</div>
