<div class="nap-filter">
    <div class="row">
      <div class="nap-col">
        <div class="nap-group">
          <label>From</label>
          <div class="nap-control">
            <nap-date-picker [minDate]="minStartDate" [(date)]="startDate" [maxDate]="endDate"></nap-date-picker>
          </div>
        </div>
      </div>
      <div class="nap-col">
        <div class="nap-group">
          <label>To</label>
          <div class="nap-control">
            <nap-date-picker [(date)]="endDate" [minDate]="startDate" [maxDate]="maxEndDate"></nap-date-picker>
          </div>
        </div>
      </div>
      <div class="nap-col">
        <div class="nap-group">
          <label class="width-150">Promotion Type</label>
          <div class="nap-control">
            <ngx-dropdown-treeview #promotionTypeDropdownTreeview [items]="promotionTypes | promotionTypeTreeviewItem"
              [config]="promotionTypeTreeviewConfig" (selectedChange)="selectedPromotionTypes = $event">
            </ngx-dropdown-treeview>
          </div>
        </div>
      </div>
      <div class="nap-col">
        <label class="width-50">&nbsp;</label>
        <button type="button" class="btn btn-primary" (click)="onGenerateClick()">
          GENERATE
        </button>
      </div>
    </div>
  </div>
