<ng-template #colgroup>
    <colgroup>
        <col style="width: 170px" />
        <col style="width: 90px" />
        <col style="width: 150px" />
        <col style="width: 150px" />
        <col style="width: 90px" />
        <col style="width: 90px" />
        <col style="width: 150px" />
    </colgroup>
</ng-template>
<ng-template #thead>
    <thead>
        <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Win Loss</th>
            <th>Turnover</th>
            <th>Margin</th>
            <th>Bet Count</th>
            <th>Category</th>
        </tr>
    </thead>
</ng-template>
<div *ngIf="data" class="nap-grid" [ngSwitch]="hasData">
    <div style="width: 908px">
        <div class="header">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <ng-template [ngTemplateOutlet]="thead"></ng-template>
            </table>
        </div>
        <div *ngSwitchCase="true" class="body">
            <table class="table-striped">
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tbody>
                    <tr *ngFor="let item of data.Entities | paginate: config">
                        <ng-template [ngIf]="item.RoleName == '' || item.RoleName == 'Member'">
                            <td class="word-break-all"><a href="javascript:;" (click)="showSportType(item.CustId, item.Username)">{{
                              item.Username }}</a></td>
                            <td class="text-center">{{ item.RoleName }}</td>
                            <td class="number" [napDecimalFormat]="item.WinLoss"></td>
                            <td class="text-right" [napDecimalFormat]="item.Turnover"></td>
                            <td class="number" [napPercentFormat]="item.WinLoss/item.Turnover"></td>
                            <td class="text-right">
                              <a href="javascript:;" (click)="showBetCount(item.CustId, item.Username)"
                                  [napIntegerFormat]="item.BetCount"></a>
                          </td>
                          <td class="text-center">{{ item.Category }}</td>
                        </ng-template>
                        <ng-template [ngIf]="item.RoleName != '' && item.RoleName != 'Member'">
                            <td class="word-break-all">{{ item.Username }}</td>
                            <td class="text-center">{{ item.RoleName }}</td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </ng-template>
                    </tr>
                </tbody>
            </table>
        </div>
        <div *ngSwitchCase="false" class="body stretch">
            <table>
                <tbody>
                    <tr>
                        <th class="no-data" colspan="7">
                            There is no data
                        </th>
                    </tr>
                </tbody>
            </table>
        </div>
        <div *ngSwitchCase="true" class="footer">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tfoot>
                    <tr>
                        <td class="text-right">Total</td>
                        <td></td>
                        <td class="number" [napDecimalFormat]="data.Total.WinLoss"></td>
                        <td class="text-right" [napDecimalFormat]="data.Total.Turnover"></td>
                        <td class="number" [napPercentFormat]="data.Total.WinLoss/data.Total.Turnover"></td>
                        <td class="text-right" [napIntegerFormat]="data.Total.BetCount"></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td colspan="7">
                            <nap-pagination [config]="config"></nap-pagination>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
