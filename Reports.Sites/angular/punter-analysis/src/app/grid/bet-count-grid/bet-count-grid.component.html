<ng-template #colgroup>
    <colgroup>
        <col style="width: 210px" />
        <col style="width: 140px" />
        <col style="width: 140px" />
        <col style="width: 140px" />
        <col style="width: 140px" />
    </colgroup>
</ng-template>
<ng-template #thead>
    <thead>
        <tr>
            <th>Date</th>
            <th>Bet Count</th>
            <th>Win Count</th>
            <th>Draw Count</th>
            <th>Win Loss</th>
        </tr>
    </thead>
</ng-template>

<div *ngIf="data" class="nap-grid" [ngSwitch]="hasData"> 
    <div style="width: 790px">
        <div class="header">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <ng-template [ngTemplateOutlet]="thead"></ng-template>
            </table>
        </div>
        <div *ngSwitchCase="true" class="body">
            <table class="table-striped">
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tbody>
                    <tr *ngFor="let item of data.Entities">
                        <td class="text-center">{{ item.Date }}</td>
                        <td class="text-right" [napIntegerFormat]="item.BetCount"></td>
                        <td class="text-right" [napIntegerFormat]="item.WinCount"></td>
                        <td class="text-right" [napIntegerFormat]="item.DrawCount"></td>
                        <td class="number" [napDecimalFormat]="item.WinLoss"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div *ngSwitchCase="false" class="body stretch">
            <table>
                <tbody>
                    <tr>
                        <th class="no-data" colspan="5">
                            There is no data
                        </th>
                    </tr>
                </tbody>
            </table>
        </div>
        <div *ngSwitchCase="true" class="footer">
            <table>
                <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                <tfoot>
                    <tr>
                        <td class="text-right">Total</td>
                        <td class="text-right" [napIntegerFormat]="data.Total.BetCount"></td>
                        <td class="text-right" [napIntegerFormat]="data.Total.WinCount"></td>
                        <td class="text-right" [napIntegerFormat]="data.Total.DrawCount"></td>
                        <td class="number" [napDecimalFormat]="data.Total.WinLoss"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
