<div class="row">
  <div class="nap-col">
    <div class="nap-group">
      <label>Period type</label>
      <div class="nap-control">
        <select class="form-control" [(ngModel)]="periodType" (ngModelChange)="onTypeChange()">
          <option *ngFor="let option of periodTypeOptions" [ngValue]="option.value">{{option.text}}</option>
        </select>
      </div>
    </div>
  </div>
  <div [ngSwitch]="periodType">
    <div *ngSwitchCase="PeriodType.Daily">
      <div class="nap-col">
        <div class="nap-group">
          <label>From</label>
          <div class="nap-control">
            <nap-date-picker [(date)]="dailyFromDate" [minDate]="minDate" [maxDate]="dailyToDate"
              (dateChange)="onDailyDateChange()"></nap-date-picker>
          </div>
        </div>
      </div>
      <div class="nap-col">
        <div class="nap-group">
          <label>To</label>
          <div class="nap-control">
            <nap-date-picker [(date)]="dailyToDate" [minDate]="dailyFromDate" [maxDate]="maxDate"
              (dateChange)="onDailyDateChange()"></nap-date-picker>
          </div>
        </div>
      </div>
    </div>
    <div *ngSwitchCase="PeriodType.Monthly">
      <div class="nap-col">
        <div class="nap-control">
          <nap-month-picker [(date)]="monthlyDate" [minDate]="minDate" [maxDate]="maxDate"
            (dateChange)="onMonthlyDateChange()"></nap-month-picker>
        </div>
      </div>
    </div>
    <div *ngSwitchCase="PeriodType.Annually">
      <div class="nap-col">
        <div class="nap-control anually">
          <nap-year-picker [(date)]="annuallyDate" [minDate]="minDate" [maxDate]="maxDate"
            (dateChange)="onAnnuallyDateChange()"></nap-year-picker>
        </div>
      </div>
    </div>
  </div>
</div>
