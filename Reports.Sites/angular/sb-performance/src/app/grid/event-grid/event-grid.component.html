<ng-template #colgroup>
  <colgroup>
    <col style="width: 250px" />
    <col *ngIf="isShowNoMatchesAndNoBetTypeColumn" style="width: 100px" />
    <col *ngIf="isShowNoMatchesAndNoBetTypeColumn" style="width: 100px" />
    <col style="width: 100px" />
    <col *ngIf="!isHideActiveMember" style="width: 150px" />
    <col style="width: 120px" />
    <col style="width: 120px" />
    <col style="width: 120px" />
  </colgroup>
</ng-template>

<ng-template #thead>
  <thead>
    <tr>
      <th scope="col" (click)="sort('Event')">Event
        <i class="fa" [ngClass]="{'fa-sort': sortColumnName != 'Event',
        'fa-sort-asc': (sortColumnName == 'Event' && sortDirection == 'desc'),
        'fa-sort-desc': (sortColumnName == 'Event' && sortDirection == 'asc')}"></i>
      </th>
      <th *ngIf="isShowNoMatchesAndNoBetTypeColumn" scope="col" (click)="sort('NoMatches')">No. Matches
        <i class="fa" [ngClass]="{'fa-sort': sortColumnName != 'NoMatches',
        'fa-sort-asc': (sortColumnName == 'NoMatches' && sortDirection == 'desc'),
        'fa-sort-desc': (sortColumnName == 'NoMatches' && sortDirection == 'asc')}"></i>
      </th>
      <th *ngIf="isShowNoMatchesAndNoBetTypeColumn" scope="col" (click)="sort('NoBetTypes')">No. BetTypes
        <i class="fa" [ngClass]="{'fa-sort': sortColumnName != 'NoBetTypes',
        'fa-sort-asc': (sortColumnName == 'NoBetTypes' && sortDirection == 'desc'),
        'fa-sort-desc': (sortColumnName == 'NoBetTypes' && sortDirection == 'asc')}"></i>
      </th>
      <th scope="col" (click)="sort('BetCount')">Bet Count
        <i class="fa" [ngClass]="{'fa-sort': sortColumnName != 'BetCount',
        'fa-sort-asc': (sortColumnName == 'BetCount' && sortDirection == 'desc'),
        'fa-sort-desc': (sortColumnName == 'BetCount' && sortDirection == 'asc')}"></i>
      </th>
      <th *ngIf="!isHideActiveMember" scope="col" (click)="sort('ActiveMembers')">Active Members
        <i class="fa" [ngClass]="{'fa-sort': sortColumnName != 'ActiveMembers',
        'fa-sort-asc': (sortColumnName == 'ActiveMembers' && sortDirection == 'desc'),
        'fa-sort-desc': (sortColumnName == 'ActiveMembers' && sortDirection == 'asc')}"></i>
      </th>
      <th scope="col" (click)="sort('RealIncome')">{{isHideActiveMember ? 'Win Loss' : 'Real Income'}}
        <i class="fa" [ngClass]="{'fa-sort': sortColumnName != 'RealIncome',
        'fa-sort-asc': (sortColumnName == 'RealIncome' && sortDirection == 'desc'),
        'fa-sort-desc': (sortColumnName == 'RealIncome' && sortDirection == 'asc')}"></i>
      </th>
      <th scope="col" (click)="sort('RealTurnover')">{{isHideActiveMember ? 'Turnover' : 'Real Turnover'}}
        <i class="fa" [ngClass]="{'fa-sort': sortColumnName != 'RealTurnover',
        'fa-sort-asc': (sortColumnName == 'RealTurnover' && sortDirection == 'desc'),
        'fa-sort-desc': (sortColumnName == 'RealTurnover' && sortDirection == 'asc')}"></i>
      </th>
      <th scope="col" (click)="sort('RealMargin')">Margin
        <i class="fa" [ngClass]="{'fa-sort': sortColumnName != 'RealMargin',
        'fa-sort-asc': (sortColumnName == 'RealMargin' && sortDirection == 'desc'),
        'fa-sort-desc': (sortColumnName == 'RealMargin' && sortDirection == 'asc')}"></i>
      </th>
    </tr>
  </thead>
</ng-template>

<ng-template #rowItem let-item="item">
  <td *ngIf="isShowNoMatchesAndNoBetTypeColumn" class="text-left">{{item.Event}}</td>
  <td *ngIf="!isShowNoMatchesAndNoBetTypeColumn" class="text-left"><a href="javascript:;"
    (click)="showMatchesOrBetTypes(item.Id, item.Event)">{{item.Event}}</a></td>
  <td *ngIf="isShowNoMatchesAndNoBetTypeColumn" class="text-right"><a href="javascript:;"
    (click)="showMatches(item.Id, item.Event)">{{item.NoMatches}}</a></td>
  <td *ngIf="isShowNoMatchesAndNoBetTypeColumn" class="text-right"><a href="javascript:;"
    (click)="showBetTypes(item.Id, item.Event)">{{item.NoBetTypes}}</a></td>
  <td class="text-right" [napIntegerFormat]="item.BetCount"></td>
  <td *ngIf="!isHideActiveMember" class="text-right" [napIntegerFormat]="item.ActiveMembers"></td>
  <td *ngIf="isShowFullColumn" class="text-right" [ngClass]="{'number-negative-black': isHideActiveMember}" [napDecimalFormat]="item.RealIncome"></td>
  <td *ngIf="!isShowFullColumn" class="text-right">N/A</td>
  <td *ngIf="isShowFullColumn" class="text-right" [napDecimalFormat]="item.RealTurnover"></td>
  <td *ngIf="!isShowFullColumn" class="text-right">N/A</td>
  <td class="text-right" [ngClass]="{'number-negative-black': isHideActiveMember}" [napPercentFormat]="item.RealMargin"></td>
</ng-template>

<ng-template #rowTotalItem let-item="item">
  <td class="text-right">Total</td>
  <td *ngIf="isShowNoMatchesAndNoBetTypeColumn" class="text-right" [napIntegerFormat]="item.NoMatches"></td>
  <td *ngIf="isShowNoMatchesAndNoBetTypeColumn" class="text-right" [napIntegerFormat]="item.NoBetTypes"></td>
  <td class="text-right" [napIntegerFormat]="item.BetCount"></td>
  <td *ngIf="!isHideActiveMember" class="text-right" [napIntegerFormat]="item.ActiveMembers"></td>
  <td *ngIf="isShowFullColumn" class="text-right" [ngClass]="{'number-negative-black': isHideActiveMember}" [napDecimalFormat]="item.RealIncome"></td>
  <td *ngIf="!isShowFullColumn" class="text-right">N/A</td>
  <td *ngIf="isShowFullColumn" class="text-right" [napDecimalFormat]="item.RealTurnover"></td>
  <td *ngIf="!isShowFullColumn" class="text-right">N/A</td>
  <td class="text-right" [ngClass]="{'number-negative-black': isHideActiveMember}" [napPercentFormat]="item.RealMargin"></td>
</ng-template>

<div *ngIf="data" [ngSwitch]="hasData">
  <div class="nap-grid">
    <div [style.width]="isShowNoMatchesAndNoBetTypeColumn ? isHideActiveMember ? '930px' : '1080px' : '880px'">
      <div class="header">
        <table>
          <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
          <ng-template [ngTemplateOutlet]="thead"></ng-template>
        </table>
      </div>
      <div *ngSwitchCase="true" class="body">
        <table class="table-striped">
          <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
          <tbody>
            <tr *ngFor="let item of data.Entities">
              <ng-template [ngTemplateOutlet]="rowItem" [ngTemplateOutletContext]="{ item: item }">
              </ng-template>
            </tr>
          </tbody>
        </table>
      </div>
      <div *ngSwitchCase="false" class="body stretch">
        <table>
          <tbody>
            <tr>
              <th class="no-data" [attr.colspan]="isShowNoMatchesAndNoBetTypeColumn ? isHideActiveMember ? 7 : 8 : 6">
                The data is not available.
              </th>
            </tr>
          </tbody>
        </table>
      </div>
      <div *ngSwitchCase="true" class="footer">
        <table>
          <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
          <tfoot>
            <tr class="total">
              <ng-template [ngTemplateOutlet]="rowTotalItem" [ngTemplateOutletContext]="{ item: data.Total }">
              </ng-template>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>
</div>
