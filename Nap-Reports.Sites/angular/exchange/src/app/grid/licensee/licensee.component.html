<ng-template #colgroup>
  <colgroup>
      <col style="width: 120px" />
      <col style="width: 80px" />
      <col style="width: 80px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
      <col style="width: 120px" />
  </colgroup>
</ng-template>
<ng-template #thead>
  <thead>
      <tr>
          <th scope="col" rowspan="2">Licensee</th>
          <th scope="col" rowspan="2">Member Count</th>
          <th scope="col" rowspan="2">Bet Count</th>
          <th scope="col" rowspan="2">Turnover</th>
          <th scope="col" colspan="3">Member</th>
          <th scope="col" colspan="3">Licensee</th>
          <th scope="col" colspan="4">Company</th>
      </tr>
      <tr>
          <th scope="col">WinLoss</th>
          <th scope="col">Commission</th>
          <th scope="col">Total</th>
          <th scope="col">WinLoss</th>
          <th scope="col">Commission</th>
          <th scope="col">Total</th>
          <th scope="col">WinLoss</th>
          <th scope="col">Commission</th>
          <th scope="col">Pay To Supplier</th>
          <th scope="col">Net Income</th>
      </tr>
  </thead>
</ng-template>
<ng-template #breadcrumbToolboxTemplate>
  <div class="breadcrumb-toolbox">
      <div class="toolbox-item">
          <i class="nap-icon nap-icon-breadcrumb-excel" aria-hidden="true" title="Export excel" (click)="exportExcel()"></i>
      </div>
  </div>
</ng-template>
<ng-template #rowLicenseeItem let-item="item">
  <tr class="sub-total-row font-weight-bold">
  <td (click)="item.collapsed=!item.collapsed">
    <i [ngClass]="{'fa-caret-down': item.collapsed, 'fa-caret-right': !item.collapsed}"
                                    class="fa"></i>&nbsp;
    <a href="javascript:;" (click)="showSports(item.Name)">{{ item.Name }}</a>
    <td class="text-right" [napIntegerFormat]="item.MemberCount"></td>
    <td class="text-right" [napIntegerFormat]="item.BetCount"></td>
    <td class="text-right" [napDecimalFormat]="item.TurnOver"></td>
    <td class="text-right" [napDecimalFormat]="item.MemberWinLoss"></td>
    <td class="text-right" [napDecimalFormat]="item.MemberCommission"></td>
    <td class="text-right" [napDecimalFormat]="item.MemberTotal"></td>
    <td class="text-right" [napDecimalFormat]="item.LicenseeWinLoss"></td>
    <td class="text-right" [napDecimalFormat]="item.LicenseeCommission"></td>
    <td class="text-right" [napDecimalFormat]="item.LicenseeTotal"></td>
    <td class="text-right" [napDecimalFormat]="item.CompanyWinLoss"></td>
    <td class="text-right" [napDecimalFormat]="item.CompanyCommission"></td>
    <td class="text-right" [napDecimalFormat]="item.PayToSupplier"></td>
    <td class="text-right" [napDecimalFormat]="item.CompanyNetIncome"></td>
  </tr>
</ng-template>
<ng-template #rowMaketItem let-item="item">
  <td>{{ item.MarketType }}</td>
  <td class="text-right" [napIntegerFormat]="item.MemberCount"></td>
  <td class="text-right" [napIntegerFormat]="item.BetCount"></td>
  <td class="text-right" [napDecimalFormat]="item.TurnOver"></td>
  <td class="text-right" [napDecimalFormat]="item.MemberWinLoss"></td>
  <td class="text-right" [napDecimalFormat]="item.MemberCommission"></td>
  <td class="text-right" [napDecimalFormat]="item.MemberTotal"></td>
  <td class="text-right" [napDecimalFormat]="item.LicenseeWinLoss"></td>
  <td class="text-right" [napDecimalFormat]="item.LicenseeCommission"></td>
  <td class="text-right" [napDecimalFormat]="item.LicenseeTotal"></td>
  <td class="text-right" [napDecimalFormat]="item.CompanyWinLoss"></td>
  <td class="text-right" [napDecimalFormat]="item.CompanyCommission"></td>
  <td class="text-right" [napDecimalFormat]="item.PayToSupplier"></td>
  <td class="text-right" [napDecimalFormat]="item.CompanyNetIncome"></td>
</ng-template>
<div *ngIf="exchangeModel" [ngSwitch]="exchangeModel.ExchangeLicensees.length > 0">
  <div class="nap-grid">
      <div style="width: 1620px;">
          <nap-breadcrumb *ngSwitchCase="true" [items]="[breadcrumbItems]" [toolboxTemplate]="breadcrumbToolboxTemplate"></nap-breadcrumb>
          <nap-breadcrumb *ngSwitchCase="false" [items]="[breadcrumbItems]"></nap-breadcrumb>
      </div>
      <div style="width: 1620px;">
          <div class="header">
              <table>
                  <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                  <ng-template [ngTemplateOutlet]="thead"></ng-template>
              </table>
          </div>
          <div *ngSwitchCase="true" class="body">
              <table class="table-striped">
                  <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                  <tbody>
                      <ng-container *ngFor="let licenseeItem of exchangeModel.ExchangeLicensees">
                        <ng-template [ngTemplateOutlet]="rowLicenseeItem" [ngTemplateOutletContext]="{ item: licenseeItem.Total }">
                        </ng-template>
                        <ng-container *ngIf="licenseeItem.Total.collapsed">
                          <tr *ngFor="let marketItem of licenseeItem.Entities">
                            <ng-template [ngTemplateOutlet]="rowMaketItem" [ngTemplateOutletContext]="{ item: marketItem }">
                            </ng-template>
                          </tr>
                        </ng-container>
                      </ng-container>
                  </tbody>
              </table>
          </div>
          <div *ngSwitchCase="false" class="body stretch">
              <table>
                  <tbody>
                      <tr>
                          <th class="no-data" colspan="15">
                              There is no data
                          </th>
                      </tr>
                  </tbody>
              </table>
          </div>
          <div *ngSwitchCase="true" class="footer">
              <table>
                  <ng-template [ngTemplateOutlet]="colgroup"></ng-template>
                  <tfoot>
                      <tr class="font-weight-bold">
                        <ng-template [ngTemplateOutlet]="rowMaketItem" [ngTemplateOutletContext]="{ item: exchangeModel.GrandTotal }">
                        </ng-template>
                      </tr>
                      <tr class="font-weight-bold" *ngFor="let marketItemTotal of exchangeModel.MarketTypeTotal">
                        <ng-template [ngTemplateOutlet]="rowMaketItem" [ngTemplateOutletContext]="{ item: marketItemTotal }">
                        </ng-template>
                      </tr>
                  </tfoot>
              </table>
          </div>
      </div>
  </div>
</div>
